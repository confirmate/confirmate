syntax = "proto3";

package confirmate.assessment.v1;

import "api/assessment/metric.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "tagger/tagger.proto";

option go_package = "confirmate.io/core/api/assessment";

enum AssessmentStatus {
  ASSESSMENT_STATUS_UNSPECIFIED = 0;
  ASSESSMENT_STATUS_WAITING_FOR_RELATED = 1;
  ASSESSMENT_STATUS_ASSESSED = 2;
  ASSESSMENT_STATUS_FAILED = 3;
}

// A result resource, representing the result after assessing the cloud resource
// with id resource_id.
message AssessmentResult {
  // Assessment result id
  //
  // NOTE: id is the last column of idx_assessment_results_resource_metric_created
  // (see resource_id) to make the ordering of the latest_by_resource_id query
  // fully index-backed.
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (tagger.tags) = "gorm:\"index:idx_assessment_results_resource_metric_created,priority:4,sort:desc;index:idx_assessment_results_toe_resource_metric_created,priority:5,sort:desc\"",
    (google.api.field_behavior) = REQUIRED
  ];

  // Time of assessment
  google.protobuf.Timestamp created_at = 2 [
    (tagger.tags) = "gorm:\"serializer:timestamppb;type:timestamp;index:idx_assessment_results_resource_metric_created,priority:3,sort:desc;index:idx_assessment_results_toe_resource_metric_created,priority:4,sort:desc\"",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Reference to the metric the assessment was based on
  string metric_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (tagger.tags) = "gorm:\"index:idx_assessment_results_resource_metric_created,priority:2;index:idx_assessment_results_toe_resource_metric_created,priority:3\"",
    (google.api.field_behavior) = REQUIRED
  ];

  // Data corresponding to the metric by the given metric id
  confirmate.assessment.v1.MetricConfiguration metric_configuration = 4 [
    (tagger.tags) = "gorm:\"serializer:json\"",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Compliant case: true or false
  bool compliant = 5;

  // Reference to the last assessed evidence
  string evidence_id = 6 [
    (buf.validate.field).string.uuid = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Reference to the resource of the assessed evidence
  // The ID of the assessed resource.
  //
  // NOTE: idx_assessment_results_resource_metric_created (resource_id,
  // metric_id, created_at DESC, id DESC) backs the DISTINCT ON of the
  // latest_by_resource_id query in ListAssessmentResults. Without it, that query
  // seq-scans and sorts the whole table on disk (~20s at 150k rows; ~135ms with
  // the index). It is picked up by GORM's AutoMigrate on service startup. On a
  // large, already-populated table, pre-create it out-of-band to avoid a
  // blocking CREATE INDEX: `CREATE INDEX CONCURRENTLY
  // idx_assessment_results_resource_metric_created ON assessment_results
  // (resource_id, metric_id, created_at DESC, id DESC);` AutoMigrate detects
  // existing indexes by name and skips them.
  string resource_id = 7 [
    (buf.validate.field).string.min_len = 1,
    (tagger.tags) = "gorm:\"index:idx_assessment_results_resource_metric_created,priority:1;index:idx_assessment_results_toe_resource_metric_created,priority:2\"",
    (google.api.field_behavior) = REQUIRED
  ];

  // Resource types
  repeated string resource_types = 8 [
    (tagger.tags) = "gorm:\"serializer:json\"",
    (buf.validate.field).repeated.min_items = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // ComplianceComment contains a human readable description on the reason for (non)-compliance.
  string compliance_comment = 9 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // ComplianceDetails contains machine-readable details about which comparisons lead to a (non)-compliance.
  repeated ComparisonResult compliance_details = 10 [(tagger.tags) = "gorm:\"serializer:json\""];

  // The target of evaluation which this assessment result belongs to.
  //
  // NOTE: idx_assessment_results_target_of_evaluation_id is picked up by
  // GORM's AutoMigrate on service startup (see persistence.NewDB). On a
  // large, already-populated assessment_results table, the first startup
  // after this index is introduced will run a blocking CREATE INDEX and may
  // stall writes for a while. Consider pre-creating the index out-of-band
  // with `CREATE INDEX CONCURRENTLY
  // idx_assessment_results_target_of_evaluation_id ON assessment_results
  // (target_of_evaluation_id);` before rolling this out; AutoMigrate detects
  // the existing index by name and skips it.
  //
  // NOTE: idx_assessment_results_toe_resource_metric_created (target_of_evaluation_id,
  // resource_id, metric_id, created_at DESC, id DESC) lets the latest_by_resource_id
  // query, which is almost always filtered by target of evaluation, select the IDs of
  // the latest results with an index-only scan (no heap access). On a table with
  // ~1,000 results per (resource_id, metric_id), this took the last page of the query
  // from ~470ms to ~20ms in a local test. Pre-create it out-of-band on large tables:
  // `CREATE INDEX CONCURRENTLY idx_assessment_results_toe_resource_metric_created ON
  // assessment_results (target_of_evaluation_id, resource_id, metric_id, created_at
  // DESC, id DESC);`
  string target_of_evaluation_id = 20 [
    (buf.validate.field).string.uuid = true,
    (tagger.tags) = "gorm:\"index:idx_assessment_results_target_of_evaluation_id;index:idx_assessment_results_toe_resource_metric_created,priority:1\"",
    (google.api.field_behavior) = REQUIRED
  ];

  // Reference to the tool which provided the assessment result
  optional string tool_id = 21 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // The time of the last update of the assessment result history field
  google.protobuf.Timestamp history_updated_at = 22 [
    (tagger.tags) = "gorm:\"serializer:timestamppb;type:timestamp\"",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Stores the history of evidence IDs and timestamps for evidence that have the same content as the evidence used for this assessment result.
  repeated Record history = 23 [
    (tagger.tags) = "gorm:\"serializer:json;constraint:OnDelete:CASCADE\"",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Whether this result was supplied manually (e.g., by an auditor) instead of
  // being derived from evidence by an assessment tool. A manual result is only
  // additional information: as soon as an automatic result of the same metric
  // exists, the automatic result takes precedence in the evaluation.
  bool manual = 24;

  // Optional time until which a manual result is valid. After that, the
  // evaluation ignores it.
  optional google.protobuf.Timestamp valid_until = 25 [
    (tagger.tags) = "gorm:\"serializer:timestamppb;type:timestamp\""
  ];

  // Author of a manual result (the Confirmate user ID, if known)
  optional string author = 26;
}

// An optional structure containing more details how a comparison inside an assessment result was done and if it was successful.
message ComparisonResult {
  // Property is the property that was compared
  string property = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // Value is the value in the property
  google.protobuf.Value value = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Operator is the operator used in the comparison
  string operator = 3 [
    (buf.validate.field).string.pattern = "^(<|>|<=|>=|==|isIn|allIn)$",
    (google.api.field_behavior) = REQUIRED
  ];

  // TargetValue is the target value used in the comparison
  google.protobuf.Value target_value = 4 [
    (tagger.tags) = "gorm:\"serializer:json\"",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Success is true, if the comparison was successful
  bool success = 5 [(google.api.field_behavior) = REQUIRED];
}

message Record {
  string evidence_id = 1 [
    (buf.validate.field).string.uuid = true,
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.Timestamp evidence_recorded_at = 2 [
    (tagger.tags) = "gorm:\"serializer:timestamppb;type:timestamp\"",
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}
